name: Convert to big-endian GGUF
run-name: "BE-GGUF: ${{ inputs.model }}"

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Hugging Face model tag, e.g. Qwen/Qwen3-8B or unsloth/Qwen3-8B-GGUF (optional :QUANT narrows a GGUF repo)"
        required: true
        type: string
      quants:
        description: "Output types for safetensors models (ignored for GGUF repos)"
        type: string
        default: NATIVE,Q4_0,Q4_1,Q5_0,Q5_1,Q8_0,Q2_K,Q3_K_S,Q3_K_M,Q3_K_L,Q4_K_S,Q4_K_M,Q5_K_S,Q5_K_M,Q6_K,IQ4_NL,IQ4_XS,MXFP4_MOE
      hf_namespace:
        description: "HF user/org to upload to (default: HF_NAMESPACE variable, else the HF_TOKEN owner)"
        type: string
        default: ""
      runner:
        description: "Runner size (auto = smallest Blacksmith ARM runner with enough disk that meets target_minutes)"
        type: choice
        options: [auto, 2vcpu, 4vcpu, 8vcpu, 16vcpu, 32vcpu]
        default: auto
      target_minutes:
        description: "Auto runner: smallest runner expected to finish quantizing within this many minutes"
        type: number
        default: 15
      private:
        description: "Create the output repo as private (only when it doesn't exist yet)"
        type: boolean
        default: false
      llama_cpp_ref:
        description: "llama.cpp release (latest or bNNNN, uses prebuilt tools) or a branch/commit (builds from source)"
        type: string
        default: latest

permissions:
  contents: read

concurrency:
  group: convert-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      pipeline: ${{ steps.plan.outputs.pipeline }}
      repo_id: ${{ steps.plan.outputs.repo_id }}
      base_name: ${{ steps.plan.outputs.base_name }}
      quant_tag: ${{ steps.plan.outputs.quant_tag }}
      out_repo: ${{ steps.plan.outputs.out_repo }}
      quants: ${{ steps.plan.outputs.quants }}
      runner: ${{ steps.plan.outputs.runner }}
      need_bytes: ${{ steps.plan.outputs.need_bytes }}
      repo_existed: ${{ steps.plan.outputs.repo_existed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          activate-environment: "true"
          enable-cache: "false"

      - run: uv pip install 'huggingface_hub[hf_xet]'

      - id: plan
        name: Inspect model and pick runner
        run: python scripts/plan.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_NAMESPACE: ${{ vars.HF_NAMESPACE }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_QUANTS: ${{ inputs.quants }}
          INPUT_HF_NAMESPACE: ${{ inputs.hf_namespace }}
          INPUT_RUNNER: ${{ inputs.runner }}
          INPUT_TARGET_MINUTES: ${{ inputs.target_minutes }}

  safetensors:
    name: Safetensors
    needs: plan
    if: needs.plan.outputs.pipeline == 'safetensors'
    uses: ./.github/workflows/safetensors.yml
    with:
      runner: ${{ needs.plan.outputs.runner }}
      model: ${{ needs.plan.outputs.repo_id }}
      out_repo: ${{ needs.plan.outputs.out_repo }}
      quants: ${{ needs.plan.outputs.quants }}
      need_bytes: ${{ needs.plan.outputs.need_bytes }}
      private: ${{ inputs.private }}
      llama_cpp_ref: ${{ inputs.llama_cpp_ref }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  gguf:
    name: GGUF
    needs: plan
    if: needs.plan.outputs.pipeline == 'gguf'
    uses: ./.github/workflows/gguf.yml
    with:
      runner: ${{ needs.plan.outputs.runner }}
      model: ${{ needs.plan.outputs.repo_id }}
      tag: ${{ needs.plan.outputs.quant_tag }}
      out_repo: ${{ needs.plan.outputs.out_repo }}
      need_bytes: ${{ needs.plan.outputs.need_bytes }}
      private: ${{ inputs.private }}
      llama_cpp_ref: ${{ inputs.llama_cpp_ref }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  cleanup:
    name: Delete HF repo after failure
    needs: [plan, safetensors, gguf]
    # Only repos this run created; an existing repo keeps the files from earlier successful runs.
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.repo_existed == 'false' &&
      (contains(fromJSON('["failure", "cancelled"]'), needs.safetensors.result) ||
       contains(fromJSON('["failure", "cancelled"]'), needs.gguf.result))
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          activate-environment: "true"
          enable-cache: "false"

      - run: uv pip install huggingface_hub

      - name: Delete ${{ needs.plan.outputs.out_repo }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OUT_REPO: ${{ needs.plan.outputs.out_repo }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          repo = os.environ["OUT_REPO"]
          HfApi().delete_repo(repo, repo_type="model", missing_ok=True)
          print(f"Deleted {repo}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"Deleted `{repo}` from Hugging Face because the run failed and the repo was created by it.\n")
          PY

  readme:
    name: Save model card
    needs: [plan, safetensors, gguf]
    # After a failure, only when the HF repo existed before (a repo this run created gets deleted by cleanup).
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.repo_existed == 'true' || needs.safetensors.result == 'success' || needs.gguf.result == 'success')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - id: card
        name: Download model card
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: model-card
          path: ${{ runner.temp }}/card

      - name: Commit models/<model>/README.md and its images
        if: steps.card.outcome == 'success'
        env:
          MODEL_DIR: models/${{ needs.plan.outputs.base_name }}
          SOURCE: ${{ needs.plan.outputs.repo_id }}
        run: |
          # Drop a folder that differs only in case (e.g. from before names were title-cased);
          # two such folders break checkouts on case-insensitive file systems like macOS.
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          for d in models/*/; do
            d="${d%/}"
            if [ -d "$d" ] && [ "$d" != "$MODEL_DIR" ] && [ "$(lower "$d")" = "$(lower "$MODEL_DIR")" ]; then
              git rm -r -q "$d"
            fi
          done
          # Mirror the card folder so images referenced by relative path render on GitHub too.
          rm -rf "$MODEL_DIR"
          mkdir -p "$MODEL_DIR"
          cp -R "$RUNNER_TEMP/card/." "$MODEL_DIR/"
          git add -A "$MODEL_DIR"
          if git diff --cached --quiet; then
            echo "$MODEL_DIR is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update $MODEL_DIR model card" -m "Source: https://huggingface.co/$SOURCE"
          # Runs for other models may push at the same time; they touch other folders, so rebase and retry.
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
